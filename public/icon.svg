<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="cp-bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#226855" />
      <stop offset="100%" stop-color="#164A3C" />
    </linearGradient>
    <linearGradient id="cp-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DDA03C" />
      <stop offset="100%" stop-color="#C17F24" />
    </linearGradient>
  </defs>

  <!-- Deep Forest Green Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#cp-bg)" />
  <rect x="20" y="20" width="472" height="472" rx="98" stroke="#FAF9F5" stroke-opacity="0.14" stroke-width="6" />

  <!-- Patrol Inspection Clipboard (Warm Ivory) -->
  <rect x="120" y="114" width="236" height="296" rx="34" fill="#FAF9F5" />

  <!-- Top Amber-Gold Clip -->
  <rect x="176" y="84" width="124" height="54" rx="22" fill="url(#cp-gold)" />
  <circle cx="238" cy="111" r="10" fill="#1B5646" />

  <!-- Patrol Schedule / Inspection Checklist Rows -->
  <rect x="160" y="182" width="156" height="22" rx="11" fill="#1E5C4B" fill-opacity="0.22" />
  <rect x="160" y="232" width="128" height="22" rx="11" fill="#1E5C4B" fill-opacity="0.22" />
  <rect x="160" y="282" width="96" height="22" rx="11" fill="#1E5C4B" fill-opacity="0.22" />
  <rect x="160" y="332" width="76" height="22" rx="11" fill="#1E5C4B" fill-opacity="0.16" />

  <!-- Overlapping Amber-Gold Verified Patrol Seal (with green halo cutout) -->
  <circle cx="338" cy="342" r="96" fill="#195142" />
  <circle cx="338" cy="342" r="78" fill="url(#cp-gold)" />
  <path
    d="M300 344L326 370L378 314"
    stroke="#FAF9F5"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
